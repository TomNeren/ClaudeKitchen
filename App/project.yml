name: ClaudeKitchen
options:
  bundleIdPrefix: de.tomneren
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: de

packages:
  KitchenCore:
    path: ..

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone and iPad only: no "Designed for iPad" builds on Mac or Apple Vision, no Mac Catalyst.
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO

targets:
  ClaudeKitchen:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - package: KitchenCore
      - target: ClaudeKitchenWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tomneren.ClaudeKitchen
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Omni Cook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # Only HTTPS through the system (Claude API): exempt, so TestFlight asks no export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Sources/Info.plist
      properties:
        NSAlarmKitUsageDescription: Damit dein Kochtimer auch klingelt, wenn das iPhone gesperrt oder stumm ist.
        NSRemindersFullAccessUsageDescription: Deine Einkaufsliste landet als eigene Liste in Erinnerungen, damit du sie im Laden abhaken kannst.
        NSMicrophoneUsageDescription: Im Kochmodus hörst du auf Zuruf wie „weiter“, damit du das iPhone nicht anfassen musst.
        NSSpeechRecognitionUsageDescription: Deine Sprachbefehle im Kochmodus werden auf dem iPhone in Text umgewandelt.
    scheme: {}

  ClaudeKitchenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: KitchenCore
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tomneren.ClaudeKitchen.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Omni Cook
        TARGETED_DEVICE_FAMILY: "1,2"
