name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kitchencore-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SWIFT_VERSION: "6.4.1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}

      - name: Install Swift
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libxml2-dev libz3-dev
          if [ ! -x "$HOME/.local/share/swiftly/bin/swiftly" ]; then
            curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
            tar zxf "swiftly-$(uname -m).tar.gz"
            ./swiftly init --quiet-shell-followup --assume-yes --skip-install
            rm -f swiftly "swiftly-$(uname -m).tar.gz"
          fi
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes "$SWIFT_VERSION"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift App/Sources

  app-ios:
    # Xcode 27 ships on its own image label (macOS 27, Apple Silicon), not on macos-26.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          if ! xcodebuild -version | head -1 | grep -q '^Xcode 27'; then
            echo "::error::No Xcode 27 on this runner image; KitchenCore needs Swift 6.4 tools."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec App/project.yml

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project App/ClaudeKitchen.xcodeproj \
            -scheme ClaudeKitchen \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
