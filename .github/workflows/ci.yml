name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kitchencore-macos:
    # Self-hosted runner on the developer's Mac with Xcode 27 (Swift 6.4).
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Build
        run: xcrun swift build --build-tests

      - name: Test
        run: xcrun swift test

      - name: Lint
        run: xcrun swift format lint --strict --recursive Sources Tests Package.swift
